<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Rysunek techniczny prostokątnego zbiornika retencyjnego</title>
  <desc id="desc">Widok boczny i widok z góry z oznaczeniami wymiarów S1, S2, D1, D2, V1 i V2 oraz opisami przyłączy.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#1f2a28"/>
    </marker>
    <style>
      .tank { fill: #e7e9e7; stroke: #68706d; stroke-width: 2.5; }
      .rib { stroke: #7a827f; stroke-width: 4; fill: none; }
      .thin { stroke: #818a86; stroke-width: 2; fill: none; }
      .dim { stroke: #1f2a28; stroke-width: 2.2; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .guide { stroke: #aab2ae; stroke-width: 1.6; fill: none; }
      .label { fill: #1b2522; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; }
      .small { fill: #28342f; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 600; }
      .dimtext { fill: #1f2a28; font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1320" height="760" fill="#fff"/>

  <!-- Side view -->
  <g transform="translate(70 70)">
    <rect class="tank" x="55" y="110" width="535" height="455"/>
    <rect class="tank" x="100" y="25" width="190" height="85"/>
    <rect class="tank" x="96" y="10" width="198" height="15"/>
    <rect class="tank" x="300" y="88" width="315" height="22"/>
    <line class="rib" x1="60" y1="250" x2="610" y2="250"/>
    <line class="rib" x1="60" y1="430" x2="610" y2="430"/>
    <line class="rib" x1="190" y1="130" x2="190" y2="545"/>
    <line class="rib" x1="325" y1="130" x2="325" y2="545"/>
    <line class="rib" x1="460" y1="130" x2="460" y2="545"/>
    <line class="thin" x1="35" y1="120" x2="75" y2="120"/>
    <line class="thin" x1="35" y1="140" x2="75" y2="140"/>
    <line class="dim" x1="20" y1="130" x2="55" y2="130"/>
    <line class="thin" x1="590" y1="130" x2="630" y2="130"/>
    <line class="thin" x1="590" y1="150" x2="630" y2="150"/>
    <line class="dim" x1="628" y1="140" x2="600" y2="140"/>

    <line class="guide" x1="40" y1="110" x2="40" y2="565"/>
    <line class="guide" x1="25" y1="110" x2="55" y2="110"/>
    <line class="guide" x1="25" y1="565" x2="55" y2="565"/>
    <line class="dim" x1="38" y1="125" x2="38" y2="550"/>
    <text class="dimtext" x="0" y="345">V2</text>

    <line class="guide" x1="625" y1="90" x2="625" y2="565"/>
    <line class="guide" x1="595" y1="90" x2="640" y2="90"/>
    <line class="guide" x1="595" y1="565" x2="640" y2="565"/>
    <line class="dim" x1="623" y1="105" x2="623" y2="550"/>
    <text class="dimtext" x="646" y="340">V1</text>

    <line class="guide" x1="505" y1="145" x2="590" y2="145"/>
    <line class="dim" x1="525" y1="145" x2="525" y2="110"/>
    <text class="small" x="548" y="139">5 cm</text>
    <text class="small" x="548" y="166">różnica spadku</text>

    <text class="small" x="125" y="58">Standardowa wysokość</text>
    <text class="small" x="147" y="84">komina = 30 cm</text>
  </g>

  <!-- Top view -->
  <g transform="translate(735 78)">
    <rect class="tank" x="65" y="105" width="450" height="450"/>
    <rect class="thin" x="82" y="122" width="416" height="416"/>
    <circle class="tank" cx="290" cy="245" r="87"/>
    <line class="dim" x1="215" y1="245" x2="365" y2="245"/>
    <text class="small" x="238" y="274">średnica 650 mm</text>
    <text class="small" x="244" y="214">Wejście rewizyjne</text>
    <text class="small" x="274" y="239">(komin)</text>

    <rect class="tank" x="278" y="82" width="24" height="44"/>
    <line class="dim" x1="290" y1="75" x2="290" y2="132"/>
    <text class="label" x="236" y="28">Dopływ DN 125</text>
    <text class="small" x="205" y="55">(na zapytanie także inne średnice)</text>

    <rect class="tank" x="278" y="538" width="24" height="45"/>
    <line class="dim" x1="290" y1="520" x2="290" y2="590"/>
    <text class="label" x="222" y="505">Przelew DN 125</text>
    <text class="small" x="194" y="532">(na zapytanie także inne średnice)</text>

    <line class="guide" x1="65" y1="585" x2="515" y2="585"/>
    <line class="dim" x1="95" y1="590" x2="485" y2="590"/>
    <text class="dimtext" x="282" y="622">S1</text>
    <line class="guide" x1="45" y1="610" x2="535" y2="610"/>
    <line class="dim" x1="65" y1="615" x2="515" y2="615"/>
    <text class="dimtext" x="282" y="650">S2</text>

    <line class="guide" x1="535" y1="105" x2="535" y2="555"/>
    <line class="dim" x1="540" y1="135" x2="540" y2="525"/>
    <text class="dimtext" x="562" y="335">D1</text>
    <line class="guide" x1="570" y1="86" x2="570" y2="575"/>
    <line class="dim" x1="575" y1="105" x2="575" y2="555"/>
    <text class="dimtext" x="598" y="335">D2</text>
  </g>
</svg>
